<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon: Pulsing Sound Wave & Music Core -->
  <g transform="translate(10, 8)">
    <!-- Rounded Outer Badge -->
    <rect width="44" height="44" rx="12" fill="#181818" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
    
    <!-- Soundwave equalizer bars -->
    <rect x="11" y="22" width="3.5" height="12" rx="1.75" fill="url(#logoGrad)" />
    <rect x="17" y="14" width="3.5" height="24" rx="1.75" fill="url(#logoGrad)" filter="url(#glow)" />
    <rect x="23" y="10" width="3.5" height="29" rx="1.75" fill="url(#logoGrad)" />
    <rect x="29" y="17" width="3.5" height="19" rx="1.75" fill="url(#logoGrad)" filter="url(#glow)" />
  </g>

  <!-- Wordmark Text -->
  <text x="66" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Circular Std', 'Inter', sans-serif" font-size="24" font-weight="900" letter-spacing="-0.5">Vibe<tspan fill="#1ed760">Stream</tspan></text>
</svg>